<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의실 예약</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 16px auto; padding: 0 16px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 12px 0; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  label { display: block; font-size: 14px; margin-top: 6px; }
  input, select, button { font-size: 16px; padding: 8px; width: 100%; box-sizing: border-box; margin-top: 2px; }
  button { margin-top: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; }
  button:disabled { background: #999; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .result { margin-top: 10px; font-size: 26px; font-weight: bold; text-align: center; padding: 8px; border-radius: 6px; }
  .ok { background: #dcfce7; color: #166534; }
  .fail { background: #fee2e2; color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>강의실 예약 시스템</h1>
<p id="status">시스템(solution.py) 불러오는 중... 잠시만 기다려 주세요.</p>

<section>
  <h2>예약</h2>
  <div class="row">
    <label>강의실<input id="b_room" list="rooms" value="A101"></label>
    <label>요일<input id="b_day" list="days" value="월"></label>
  </div>
  <div class="row">
    <label>시작(시)<input id="b_start" type="number" step="any" value="10"></label>
    <label>끝(시)<input id="b_end" type="number" step="any" value="12"></label>
  </div>
  <label>이름<input id="b_name" placeholder="예: 김철수"></label>
  <button onclick="doBook()" disabled>예약하기</button>
  <div id="b_res"></div>
</section>

<section>
  <h2>취소</h2>
  <div class="row">
    <label>강의실<input id="c_room" list="rooms" value="A101"></label>
    <label>요일<input id="c_day" list="days" value="월"></label>
  </div>
  <label>시작 시각(시)<input id="c_start" type="number" step="any" value="10"></label>
  <label>이름<input id="c_name" placeholder="예약한 사람 이름"></label>
  <button onclick="doCancel()" disabled>취소하기</button>
  <div id="c_res"></div>
</section>

<section>
  <h2>시간표</h2>
  <div class="row">
    <label>강의실<input id="s_room" list="rooms" value="A101" onchange="doSchedule()"></label>
    <label>요일<input id="s_day" list="days" value="월" onchange="doSchedule()"></label>
  </div>
  <button onclick="doSchedule()" disabled>시간표 보기</button>
  <div id="s_res"></div>
</section>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
for (const [id, items] of [["rooms", ["A101", "A102", "B201"]], ["days", ["월", "화", "수", "목", "금"]]]) {
  const dl = document.createElement("datalist");
  dl.id = id;
  dl.innerHTML = items.map(v => `<option value="${v}">`).join("");
  document.body.appendChild(dl);
}
const val = id => document.getElementById(id).value;

let py, rb;
(async () => {
  try {
    py = await loadPyodide();
    const code = await (await fetch("solution.py?" + Date.now())).text();
    py.FS.writeFile("solution.py", code);
    py.runPython(`
import solution
rb = solution.RoomBooking()
def to_num(s):
    s = s.strip()
    try:
        return int(s)
    except ValueError:
        try:
            return float(s)
        except ValueError:
            return s
`);
    rb = py.globals;
    document.getElementById("status").textContent = "준비 완료";
    document.querySelectorAll("button").forEach(b => b.disabled = false);
    doSchedule();
  } catch (e) {
    document.getElementById("status").textContent = "불러오기 실패: " + e;
  }
})();

function call(expr, args) {
  for (const [k, v] of Object.entries(args)) py.globals.set(k, v);
  return py.runPython(expr);
}

function show(id, ok, okText, failText) {
  const el = document.getElementById(id);
  el.className = "result " + (ok ? "ok" : "fail");
  el.textContent = ok ? okText : failText;
}

function doBook() {
  const ok = call("rb.book(a_room, a_day, to_num(a_start), to_num(a_end), a_name) is True",
    { a_room: val("b_room"), a_day: val("b_day"), a_start: val("b_start"), a_end: val("b_end"), a_name: val("b_name") });
  show("b_res", ok, "✅ 예약 성공", "❌ 예약 실패");
  syncSchedule("b");
}

function doCancel() {
  const ok = call("rb.cancel(a_room, a_day, to_num(a_start), a_name) is True",
    { a_room: val("c_room"), a_day: val("c_day"), a_start: val("c_start"), a_name: val("c_name") });
  show("c_res", ok, "✅ 취소 성공", "❌ 취소 실패");
  syncSchedule("c");
}

function syncSchedule(p) {
  document.getElementById("s_room").value = val(p + "_room");
  document.getElementById("s_day").value = val(p + "_day");
  doSchedule();
}

function doSchedule() {
  if (!py) return;
  const rows = call("[list(b) for b in rb.get_schedule(a_room, a_day)]",
    { a_room: val("s_room"), a_day: val("s_day") }).toJs();
  const el = document.getElementById("s_res");
  const title = `<p><b>${val("s_room")} · ${val("s_day")}요일</b></p>`;
  if (rows.length === 0) { el.innerHTML = title + "<p>예약 없음</p>"; return; }
  const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
  el.innerHTML = title + "<table><tr><th>시간</th><th>이름</th></tr>" +
    rows.map(([s, e, n]) => `<tr><td>${s}~${e}시</td><td>${esc(n)}</td></tr>`).join("") + "</table>";
}
</script>
</body>
</html>
